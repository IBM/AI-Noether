# AI-Noether Configuration File
# Copy this template and modify for your run

# =============================================================================
# Paths to External Tools
# =============================================================================
paths:
  macaulay2: "/opt/homebrew/bin/M2"           # Path to Macaulay2 executable
  singular: "/opt/homebrew/bin/Singular"      # Path to Singular executable
  bertini: "/Users/ksrivastava/opt/bertini-1.7-openmpi/BertiniApple_OpenMPI_v1.7/bertini"  # Path to Bertini executable (for NAG)
  
# =============================================================================
# Problem Specification
# =============================================================================
problems:
  # Directory containing problem files (each problem in subdirectory with system.txt)
  base_dir: "systems_and_phenomena/"
  
  # List of problem names to process (subdirectory names)
  # Leave empty or comment out to use defaults
  problem_list:
    # - "kepler"
    # - "decay"
    # - "time_dilation"
    # - "inelastic_collision"
    # - "hall"
    # - "light"
    # - "hagen"
    - "escape_velocity"
    # - "compton"
    # - "photoHall"
    # - "relativistic_mass"
    # - "pendulum"
    # Add more problem names as needed

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: "results/"                    # Base directory for results
  
# =============================================================================
# Axiom Removal Configuration  
# =============================================================================
axiom_removal:
  # Number of axioms to remove. Options:
  # - "all": try all possible subset sizes from 0 to n
  # - "[a,b]" or "a..b": inclusive range (e.g., "[1,3]" means 1,2,3)
  # - "a,b,c": explicit list of sizes
  # - "k": single value
  num_axioms: "[1,3]"

# =============================================================================
# Analysis Toggles
# =============================================================================
analyses:
  projection: true                            # Run projection/elimination analysis
  dimensionality_check: true                  # Run dimension comparisons
  algebraic_abduction: true                   # Run noiseless algebraic abduction
  numerical_abduction: true                   # Run noisy numerical abduction (witness sets)

# =============================================================================
# Decomposition Settings (Noiseless Case)
# =============================================================================
decomposition:
  # Engine for primary decomposition: "m2" (Macaulay2) or "singular" (faster)
  engine: "singular"

# =============================================================================
# Reasoning Settings (Noiseless Case)
# =============================================================================
reasoning:
  # If true, require target to appear literally in Groebner basis
  # If false, only require membership (remainder = 0)
  require_literal_gb: true
  
  # Maximum subset size to consider from component generators
  # Set to -1 for no limit (uses number of removed axioms + number of targets)
  max_candidate_size: -1

# =============================================================================
# Numerical Abduction Settings (Noisy Case)
# =============================================================================
numerical:
  # Engine for numerical irreducible decomposition: "bertini" or "nag"
  engine: "bertini"

  # Noise levels to process (list of strings matching system_noise_<level>.txt files)
  # e.g., ["1e-1", "1e-2", "1e-4"] will look for system_noise_1e-1.txt, etc.
  noise_levels:
    - "1e-2"
    - "1e-5"
    - "1e-8" 
  # Number of points to sample per witness set component
  samples_per_component: 100
  
  # Singular value threshold for symbolic regression fit quality
  # Candidates with smallest singular value below this are considered good fits
  singular_value_threshold: 5

# =============================================================================
# Symbolic Regression Normalization (Noisy Case)
# =============================================================================
normalization:
  # Normalize coefficients so largest has magnitude 1
  normalize_coefficients: true
  
  # Threshold for zeroing out imaginary parts of coefficients
  # If |imag(c)| < threshold, set imag(c) = 0
  complex_threshold: 1e-6
  
  # Compute L2 norm between true and inferred coefficient vectors
  compute_coefficient_error: true

# =============================================================================
# Robust Fitting Settings (Outlier Removal)
# =============================================================================
robust_fitting:
  # Enable robust fitting with outlier removal
  enabled: true
  
  # Remove points with residual above this percentile (0-100)
  # Lower = more aggressive outlier removal
  outlier_percentile: 80.0
  
  # Maximum iterations of outlier removal
  max_iterations: 8
  
  # Minimum number of points to keep (won't remove below this)
  min_points: 10

# =============================================================================
# Execution Settings
# =============================================================================
execution:

  # Timeout in seconds for individual tasks
  timeout_projection: 600       
  timeout_dimensionality: 600   
  timeout_decomposition: 1200   
  timeout_reasoning: 1200       
  timeout_witness_set: 1800     
  
  # Verbose output to stdout
  verbose: true
  
  # Log level: "DEBUG", "INFO", "WARNING", "ERROR"
  log_level: "INFO"
